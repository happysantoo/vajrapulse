project:
  name: vajrapulse
  version: 1.0.0
  description: VajraPulse high-performance load testing framework — Java 25 virtual threads, 1.0 production release
  authors:
    - Santhosh Kuppusamy
  license: Apache-2.0
  copyright: "Copyright © 2025 Santhosh Kuppusamy"
  links:
    homepage: https://github.com/happysantoo/vajrapulse
    vcsBrowser: https://github.com/happysantoo/vajrapulse
    documentation: https://github.com/happysantoo/vajrapulse
  languages:
    java:
      groupId: com.vajrapulse

signing:
  active: ALWAYS
  armored: true

release:
  github:
    enabled: true
    overwrite: false

deploy:
  maven:
    mavenCentral:
      sonatype:
        active: ALWAYS
        url: https://central.sonatype.com/api/v1/publisher
        username: '{{mavenCentralUsername}}'
        password: '{{mavenCentralPassword}}'
        stagingRepositories:
          - target/staging-deploy
        retryDelay: 10
        maxRetries: 10
