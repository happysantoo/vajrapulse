# VajraPulse Maven Central Publishing
# Full version with triggers lives on release branches; this minimal version
# exists on main so workflow_dispatch can target feature branches.
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (skip actual publishing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x gradlew

      - name: Build, test, and verify
        run: ./gradlew build jacocoTestCoverageVerification --no-daemon

      - name: Publish to Maven Central
        env:
          MAVENCENTRALUSERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRALPASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew prepareRelease

          DRY_FLAG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_FLAG="--dry-run"
            echo "=== DRY RUN MODE — no artifacts will be published ==="
          fi

          curl -sL https://github.com/jreleaser/jreleaser/releases/download/v1.18.0/jreleaser-1.18.0.zip -o /tmp/jreleaser.zip
          unzip -q /tmp/jreleaser.zip -d /tmp/jreleaser
          /tmp/jreleaser/jreleaser-1.18.0/bin/jreleaser full-release \
            -c jreleaser.yml \
            $DRY_FLAG \
            --exclude-distribution distributions
