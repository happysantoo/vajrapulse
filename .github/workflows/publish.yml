# VajraPulse Maven Central Publishing — triggered on merge to main
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (skip actual publishing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    env:
      MAVENCENTRALUSERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVENCENTRALPASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
      JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      JRELEASER_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags for version pre-flight check

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x gradlew

      - name: Build, test, and verify
        run: ./gradlew build jacocoTestCoverageVerification --no-daemon

      - name: Stage Maven artifacts
        run: |
          ./gradlew prepareRelease publishToMavenLocal --no-daemon
          STAGING_DIR="target/staging-deploy"
          mkdir -p "$STAGING_DIR/com/vajrapulse"
          cp -r ~/.m2/repository/com/vajrapulse/* "$STAGING_DIR/com/vajrapulse/"

      - name: Publish to Maven Central
        run: |
          # Extract version from jreleaser.yml
          VERSION=$(grep -oP 'version:\s*\K\S+' jreleaser.yml | head -1)
          echo "Project version: $VERSION"

          # Pre-flight: check if this version was already published (idempotent)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — release already published. Skipping."
            exit 0
          fi

          DRY_FLAG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_FLAG="--dry-run"
            echo "=== DRY RUN MODE — no artifacts will be published ==="
          fi

          JRELEASER_VERSION="1.18.0"
          JRELEASER_SHA256="581b6089f2fecc3eefa33da530df54cbf8e8fe57f2c2c85d8d29d1b111a84424"

          curl -sL "https://github.com/jreleaser/jreleaser/releases/download/v${JRELEASER_VERSION}/jreleaser-${JRELEASER_VERSION}.zip" -o /tmp/jreleaser.zip
          echo "${JRELEASER_SHA256}  /tmp/jreleaser.zip" | sha256sum -c --strict
          unzip -q /tmp/jreleaser.zip -d /tmp/jreleaser
          /tmp/jreleaser/jreleaser-${JRELEASER_VERSION}/bin/jreleaser full-release \
            -c jreleaser.yml \
            $DRY_FLAG \
            --exclude-distribution distributions
