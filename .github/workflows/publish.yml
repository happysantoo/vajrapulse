# VajraPulse Maven Central Publishing — triggered on merge to main
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x gradlew

      - name: Build, test, and verify
        run: ./gradlew build jacocoTestCoverageVerification --no-daemon

      - name: Publish to Maven Central
        env:
          MAVENCENTRALUSERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVENCENTRALPASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Write JReleaser secrets file for signing key resolution
          python3 -c "
          import os
          with open('/tmp/secrets.properties', 'w') as f:
              f.write(f'signing.secretKey={os.environ[\"ORG_GRADLE_PROJECT_signingKey\"]}\n')
              f.write(f'signing.passphrase={os.environ[\"ORG_GRADLE_PROJECT_signingPassword\"]}\n')
          "

          ./gradlew prepareRelease

          curl -sL https://github.com/jreleaser/jreleaser/releases/download/v1.18.0/jreleaser-1.18.0.zip -o /tmp/jreleaser.zip
          unzip -q /tmp/jreleaser.zip -d /tmp/jreleaser
          /tmp/jreleaser/jreleaser-1.18.0/bin/jreleaser full-release \
            --config jreleaser.yml \
            --secrets /tmp/secrets.properties \
            --exclude-distributions \
            --auto-config=false
