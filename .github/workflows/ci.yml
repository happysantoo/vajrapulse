# VajraPulse CI Pipeline
name: CI

on:
  push:
    branches: [main, '0.9.*', '1.*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - run: chmod +x gradlew
      - name: Build
        run: ./gradlew classes --no-daemon
      - name: Test
        run: ./gradlew test --no-daemon --rerun-tasks
      - name: Coverage (90%)
        run: ./gradlew jacocoTestCoverageVerification --no-daemon
      - name: SpotBugs
        run: ./gradlew spotbugsMain --no-daemon
      - name: Examples
        run: ./gradlew compileExamples --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
